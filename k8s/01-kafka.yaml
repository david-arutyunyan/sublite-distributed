# Same KRaft single-broker setup as docker-compose's kafka service (see
# its own comments there for the full reasoning on KRaft/listeners/
# CLUSTER_ID) - only the listener addressing changes, from Docker
# Compose's container-name DNS to Kubernetes' Service DNS. No
# PLAINTEXT_HOST listener here (that existed only so kafka-console-*.sh,
# a local IDE, or Kafka UI could reach the broker from OUTSIDE Docker) -
# nothing outside the cluster needs to talk to Kafka directly for the
# app itself to work, so it's dropped rather than carried over unused.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: sublite
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: sublite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 19093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:19093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 15
            periodSeconds: 10
            # Real bug hit live: kafka-broker-api-versions.sh spins up a
            # whole JVM to run one check - it routinely takes longer than
            # Kubernetes' DEFAULT timeoutSeconds (1s, easy to forget
            # since every other field here was set explicitly except
            # this one), especially under a laptop-hosted kind cluster's
            # CPU contention. The result was a real, repeating outage:
            # the probe command itself timing out (not the broker being
            # unhealthy) was read as failure, and the liveness probe
            # killed an otherwise-healthy broker over and over.
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: sublite
spec:
  # Headless (clusterIP: None) AND publishNotReadyAddresses: true - a
  # real deadlock hit live, and headless alone didn't fix it: this
  # single broker is its own KRaft controller, and its OWN controller-
  # registration traffic needs to reach itself via kafka:19093
  # (KAFKA_CONTROLLER_QUORUM_VOTERS uses the Service name) - but by
  # DEFAULT, Kubernetes Service DNS (headless or not) only resolves to
  # READY pod endpoints, and the pod can't become ready until that
  # self-registration succeeds. Headless on its own just changes HOW
  # DNS answers (pod IPs instead of a single VIP) - it doesn't change
  # WHICH pods are eligible, still gated by readiness. Confirmed live:
  # switching to headless alone still failed with
  # `java.net.UnknownHostException: kafka`, because the not-yet-ready
  # pod had no DNS record at all yet. publishNotReadyAddresses: true is
  # what actually breaks the cycle, by making DNS answer with the pod's
  # IP even before its readinessProbe has ever passed.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 19093
      targetPort: 19093
