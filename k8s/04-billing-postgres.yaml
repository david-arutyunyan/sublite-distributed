# Same shape as subscription-postgres - own Secret, own PVC, own
# Deployment - database-per-service carries over from docker-compose
# unchanged (see docs/architecture.md for the full reasoning).
apiVersion: v1
kind: Secret
metadata:
  name: billing-postgres-credentials
  namespace: sublite
type: Opaque
stringData:
  POSTGRES_USER: billing
  POSTGRES_PASSWORD: billing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: billing-postgres-data
  namespace: sublite
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-postgres
  namespace: sublite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: billing-postgres
  template:
    metadata:
      labels:
        app: billing-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: billing
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "billing"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "billing"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: billing-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  namespace: sublite
spec:
  selector:
    app: billing-postgres
  ports:
    - port: 5432
      targetPort: 5432
