server:
  port: 8083

spring:
  application:
    name: notification-service

  # Spring Boot 4.1 renamed the MongoDB properties prefix from
  # spring.data.mongodb to spring.mongodb (confirmed by inspecting
  # MongoProperties.class directly - the same kind of package/prefix
  # reshuffle this project already hit with spring-kafka's
  # ConcurrentKafkaListenerContainerFactory).
  mongodb:
    uri: mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:notification}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
