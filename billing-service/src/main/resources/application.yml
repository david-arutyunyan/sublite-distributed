server:
  port: 8082

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

sublite:
  outbox:
    poll-interval-ms: 1000
  kafka:
    retry:
      # 4 attempts, ~500ms/1s/2s backoff (capped at max-interval) before
      # a message is dead-lettered - long enough to ride out a brief
      # blip, short enough that a genuinely broken dependency surfaces on
      # the DLQ in a few seconds, not minutes.
      max-attempts: 4
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 5000
