services:
  # KRaft mode - no ZooKeeper. A single container plays both roles
  # (broker + controller) via KAFKA_PROCESS_ROLES; a real cluster would
  # split these onto separate nodes for isolation, but for one broker
  # locally there's nothing to gain from running two containers.
  #
  # Three listener names, three jobs:
  #   PLAINTEXT      - how other containers on this compose network
  #                    reach the broker (kafka:19092) - this is what
  #                    every service's bootstrap-servers will point at.
  #   CONTROLLER     - KRaft's own internal quorum traffic (leader
  #                    election, metadata log) - never used by clients.
  #   PLAINTEXT_HOST - published to the host (localhost:9092) so
  #                    kafka-topics.sh, a local IDE, or Kafka UI can
  #                    reach the broker from outside Docker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: sublite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single-broker cluster can't satisfy a replication factor above
      # 1 for anything - these three internal topics default to 3,
      # which would leave the broker stuck complaining it can't find
      # enough nodes to replicate to.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KRaft clusters need a cluster ID baked into storage at first
      # boot (kafka-storage.sh format) - fixed here rather than
      # generated fresh each time so a `docker compose down` (without
      # -v) and back `up` reconnects to the same on-disk metadata
      # instead of drifting. Any valid 22-char base64 UUID works; this
      # one's arbitrary.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot: creates every topic from docs/architecture.md and exits.
  # --if-not-exists makes this safe to run on every `docker compose up`,
  # not just the first one.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]

  # Not required by the architecture - a debugging aid. Browsing topics/
  # partitions/consumer groups/messages through a UI is a lot faster
  # than kafka-console-consumer.sh while still learning the broker.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sublite
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # Jaeger all-in-one (step 9-10b) - collector, storage (in-memory, fine
  # for a local demo, gone on restart) and query UI all in one container.
  # OTLP receiver is on by default in modern all-in-one images (gRPC on
  # 4317, HTTP on 4318) - COLLECTOR_OTLP_ENABLED set explicitly anyway,
  # cheap insurance against relying on a default that could change.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # One Postgres CONTAINER per service, not one instance with per-service
  # schemas (the monolith's approach) - a shared instance is a shared
  # failure domain and an easy back door for one service to reach into
  # another's tables "just this once". Published on 5433, not 5432 -
  # sublite-core's own Postgres already claims 5432 and the two projects
  # plausibly run side by side on this machine.
  subscription-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: subscription
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
    ports:
      - "5433:5432"
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription -d subscription"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscription-service:
    build: ./subscription-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: subscription-postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_SERVICE_NAME: subscription-service
      # 4318 (HTTP), not 4317 (gRPC) - the OTel Java agent's DEFAULT OTLP
      # protocol is http/protobuf, not gRPC (easy to assume backwards;
      # the agent itself warns loudly in its logs if the port and
      # protocol don't match, which is how this got caught).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_EXPORTER: otlp
      # Prometheus/Grafana (step 9-10a) already own metrics - a second,
      # OTel-driven metrics pipeline into Jaeger would just be a
      # confusing duplicate, not additional coverage. Same for logs -
      # this stack's logs already go to stdout (`docker compose logs`),
      # no log backend wired up to send them to.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      subscription-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Own container, own volume, published on 5434 - same database-per-
  # service reasoning as subscription-postgres above.
  billing-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5434:5432"
    volumes:
      - billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-service:
    build: ./billing-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: billing-postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_SERVICE_NAME: billing-service
      # 4318 (HTTP), not 4317 (gRPC) - the OTel Java agent's DEFAULT OTLP
      # protocol is http/protobuf, not gRPC (easy to assume backwards;
      # the agent itself warns loudly in its logs if the port and
      # protocol don't match, which is how this got caught).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      billing-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MongoDB, not Postgres - the one deliberate polyglot-persistence choice
  # in this project (see docs/architecture.md's service table). No
  # healthcheck tool baked into the mongo image the way pg_isready is for
  # Postgres - `db.adminCommand('ping')` via mongosh is the equivalent.
  notification-mongo:
    image: mongo:7.0
    ports:
      - "27018:27017"
    volumes:
      - notification_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: notification-mongo
      DB_PORT: "27017"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_SERVICE_NAME: notification-service
      # 4318 (HTTP), not 4317 (gRPC) - the OTel Java agent's DEFAULT OTLP
      # protocol is http/protobuf, not gRPC (easy to assume backwards;
      # the agent itself warns loudly in its logs if the port and
      # protocol don't match, which is how this got caught).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      notification-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Scrapes /actuator/prometheus on all three services every 5s -
  # config in prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      subscription-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # Pre-provisioned (grafana/provisioning/) with the Prometheus
  # datasource and one starter dashboard (grafana/dashboards/) - opens
  # straight to real data, no manual setup, on default admin/admin
  # credentials (fine for a local demo stack, never for anything real).
  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  kafka_data:
  subscription_postgres_data:
  billing_postgres_data:
  notification_mongo_data:
  prometheus_data:
  grafana_data:
